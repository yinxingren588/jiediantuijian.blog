<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#primary-grad)"/>
  <!-- Central Hub / Node Network -->
  <circle cx="32" cy="32" r="8" fill="#ffffff" filter="drop-shadow(0 0 4px rgba(255,255,255,0.6))"/>
  <circle cx="32" cy="32" r="4" fill="#0284c7"/>
  <!-- Satellite Nodes -->
  <circle cx="16" cy="20" r="4.5" fill="url(#node-glow)"/>
  <circle cx="48" cy="20" r="4.5" fill="url(#node-glow)"/>
  <circle cx="16" cy="44" r="4.5" fill="url(#node-glow)"/>
  <circle cx="48" cy="44" r="4.5" fill="url(#node-glow)"/>
  <circle cx="32" cy="12" r="3.5" fill="#bae6fd"/>
  <circle cx="32" cy="52" r="3.5" fill="#bae6fd"/>
  <!-- Connection Lines -->
  <line x1="32" y1="32" x2="16" y2="20" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="32" y1="32" x2="48" y2="20" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="32" y1="32" x2="16" y2="44" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="32" y1="32" x2="48" y2="44" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="32" y1="32" x2="32" y2="12" stroke="#bae6fd" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="32" y2="52" stroke="#bae6fd" stroke-width="1.5"/>
</svg>
